[neo4j]
uri = "bolt://localhost:7687"
user = "neo4j"
password = "reaper"

[vllm]
base_url = "http://localhost:8035/v1"
model = "deepseek"

[thinking_levels]
# Maps to max_completion_tokens (TOTAL budget: thinking + response).
# Structured JSON responses typically consume 200-2000 tokens, so
# these values leave headroom beyond the thinking portion.
# minimal=1024, low=4096, medium=12288, high=20480, max=40960, xhigh=81920.
#
# EFFORT SEMANTICS (empirically verified 2026-09-28 against the live :8035
# vLLM 0.24.0 + DeepSeek-V4 tokenizer, scripts/probe_effort.py):
#   - The tokenizer collapses every effort value: "none" disables thinking;
#     "max"/"xhigh" add the deep "absolute maximum" reasoning directive;
#     everything else (minimal/low/medium/high) is a THINNED "high" thinking
#     mode that is CHEAP (tens-hundreds of reasoning tokens on simple tasks;
#     1-8s). Only genuinely deep work ever approaches the max budget.
#   - The effort tier is a CAPACITY, not a mandate: a max directive on a
#     trivial task still finishes in ~2s. So high-effort tiers cost nothing
#     unless the task actually needs deep reasoning.
#   - REAPER sends chat_template_kwargs.reasoning_effort ONLY for the deep
#     tiers ("max"->"xhigh", "xhigh"->"xhigh"); all other levels send nothing
#     and get the cheap default high-mode thinking.
#
# AUDIT 2026-09-28 — user-directed policy: "use medium/high rather than xhigh;
# force the critics to be xhigh and give specific feedback to the point that
# lower levels of effort aren't needed."
#   xhigh (deepest capacity + deep directive) — the GATE + rare deep work:
#     critic="xhigh"            THE truth gate: sets truth_level on every claim
#                               and hands back SPECIFIC feedback. Forcing this
#                               deep makes cheaper upstream stages unnecessary.
#     recovery_followup="xhigh" rare follow-up type-recovery rounds (struct
#                               applied earlier exposes new access patterns) —
#                               deep type work is load-bearing for metric 5.
#   high (cheap thinned thinking, cover 99% of calls):
#     pass0_type_recovery="high"  struct layouts feed metric 5 + field renames
#     pass2_review="high"         main claim/rename source; critic GATES claims
#                                 (specific feedback -> review retries, so
#                                 review does not need max)
#     investigation="high"        claims are critic-gated; requeue on reject
#     merge="high"                conflict resolution is narrow+rare; ONLY
#                                 triggered when a shadow diff has conflicts
#     resynthesis="high"          group-level contradiction/dup review; the
#                                 deep critic supervises downstream claims
#   minimal (no downstream truth gate; protect shared serialized :8035 budget):
#     pass1_rename, scheduler -> "minimal"
pass0_type_recovery = "high"
recovery_followup = "xhigh"
pass1_rename = "minimal"
pass2_review = "high"
critic = "xhigh"
investigation = "high"
merge = "high"
resynthesis = "high"
scheduler = "minimal"

[limits]
max_critic_rejections = 3          # after this, accept at 'speculation' and move on
max_review_retries = 2             # Pass 2 review retries with critic feedback
max_resynthesis_iterations = 5     # prevent investigation<->resynthesis infinite loop
max_investigation_iterations = 200 # cap the investigation drain loop (livelock guard)
max_type_recovery_rounds = 5       # cap the pass-0 -> follow-up (recovery_followup) fixed-point loop
shadow_copy_hops = 2               # N-hop neighborhood for shadow checkouts
task_timeout_seconds = 600         # stale task timeout (measured from assignment)
max_concurrent_agents = 8          # CPU-side agent tasks (context assembly overlaps freely)
llm_max_concurrent = 4             # bounded batching (2026-09-28): server is vLLM 0.24.0 on
                                   # 2x RTX PRO 6000 (98GB), DeepSeek-V4 MLA batches safely.
                                   # 4 in-flight lets the server batch without hammering the
                                   # shared :8035; raised from the original hard 1 (which was
                                   # a vLLM-bug-era stability guard now obsolete). Revisit with
                                   # server --max-num-seqs raised to 64 to actually see gains.
max_context_tokens = 32768         # truncation limit for context assembly

[paths]
data_dir = "data"
traces_dir = "data/traces"
