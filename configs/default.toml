[neo4j]
uri = "bolt://localhost:7687"
user = "neo4j"
password = "reaper"

[vllm]
base_url = "http://localhost:8035/v1"
model = "deepseek"

[thinking_levels]
# Maps to max_completion_tokens (TOTAL budget: thinking + response).
# Structured JSON responses typically consume 200-2000 tokens, so
# these values leave headroom beyond the thinking portion.
# minimal=1024, low=4096, medium=12288, high=20480, max=40960.
# AUDIT 2026-09-27 — policy: QUALITY-GATED -> high/xhigh; NOT gated -> minimal.
#   Gated (a critic/review gate judges the output and it feeds the report):
#     pass2_review="max"  review agent is the main claim/rename source + the
#                         task critic derives from this same level
#     critic="high"       the gate itself — sets truth_level on every claim
#     investigation="high" claims are critic-gated; task requeued on reject
#   Ungated (no downstream truth gate; keep minimal to protect the shared
#     serialized :8035 budget):
#     pass0_type_recovery, pass1_rename, merge, scheduler -> "minimal"
#   Borderline: resynthesis is NOT critic-gated but edits the ledger directly
#   (merged/deleted claims). "minimal" per the strict rule; raise to "high"
#   if you consider it load-bearing.
pass0_type_recovery = "minimal"
pass1_rename = "minimal"
pass2_review = "max"
critic = "high"
investigation = "high"
merge = "minimal"
resynthesis = "minimal"
scheduler = "minimal"

[limits]
max_critic_rejections = 3          # after this, accept at 'speculation' and move on
max_review_retries = 2             # Pass 2 review retries with critic feedback
max_resynthesis_iterations = 5     # prevent investigation<->resynthesis infinite loop
max_investigation_iterations = 200 # cap the investigation drain loop (livelock guard)
shadow_copy_hops = 2               # N-hop neighborhood for shadow checkouts
task_timeout_seconds = 600         # stale task timeout (measured from assignment)
max_concurrent_agents = 8          # parallel vLLM sessions
max_context_tokens = 32768         # truncation limit for context assembly

[paths]
data_dir = "data"
traces_dir = "data/traces"
